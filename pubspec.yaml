name: pricelens_id
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  
  # Google Sign In
  google_sign_in: ^6.2.1
  
  # Gemini AI
  google_generative_ai: ^0.4.6
  # Camera & ML
  camera: ^0.12.0+1
  google_mlkit_barcode_scanning: ^0.14.2
  image_picker: ^1.2.2
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # UI & Charts
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  dynamic_color: ^1.7.0
  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  go_router: ^14.3.0
  dio: ^5.7.0
  uuid: ^4.5.3
  flutter_dotenv: ^5.1.0
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
